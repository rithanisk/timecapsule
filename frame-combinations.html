const catalog = document.getElementById('catalog');
const dialog = document.getElementById('detail');
const palette = ['#e9c9bf','#d7e5df','#dce5f2','#f2e5c8','#ddd5ea','#e7d6c4'];
function buildFrame(frame, people, perPerson, photos, maxWidth, maxHeight) {
  const scale = Math.min(maxWidth / frame.width, maxHeight / frame.height);
  const holder = document.createElement('div');
  holder.className = 'frame';
  holder.style.width = `${frame.width * scale}px`;
  holder.style.height = `${frame.height * scale}px`;
  for (const slot of frame.slots) {
    const cell = document.createElement('div');
    cell.className = 'slot';
    cell.style.left = `${slot.x / frame.width * 100}%`;
    cell.style.top = `${slot.y / frame.height * 100}%`;
    cell.style.width = `${slot.w / frame.width * 100}%`;
    cell.style.height = `${slot.h / frame.height * 100}%`;
    cell.style.transform = `rotate(${slot.rotation}deg)`;
    cell.style.zIndex = slot.z;
    if (photos) {
      const image = document.createElement('img');
      const pair = data.pairs[(slot.person - 1 + Math.floor((slot.photo - 1) / 2) * people) % data.pairs.length];
      image.src = `assets/home-samples/${pair[(slot.photo - 1) % 2]}`;
      image.alt = `Person ${slot.person}, photo ${slot.photo}`;
      cell.appendChild(image);
    } else {
      cell.style.background = palette[(slot.person - 1) % palette.length];
      const label = document.createElement('span');
      label.textContent = `${slot.person}.${slot.photo}`;
      cell.appendChild(label);
    }
    holder.appendChild(cell);
  }
  if (frame.file && !frame.generated) {
    const overlay = document.createElement('img');
    overlay.className = 'overlay';
    overlay.loading = 'lazy';
    overlay.src = `artifacts/timecapsule/public/photobooth-frames/${frame.file}`;
    overlay.alt = '';
    holder.appendChild(overlay);
  }
  return holder;
}
for (const [style, heading, note] of [['photostrip', 'Photostrip', 'One vertical column · square photos · narrow gaps'], ['side-by-side', 'Side by side', 'Taller photos · 2 + 2 for four · columns adapt to the total'], ['collage', 'Collage', 'Reference layouts from the frame collection'], ['editorial', 'Editorial', 'Reference layouts from the frame collection'], ['polaroid', 'Polaroid', 'Reference layouts from the frame collection'], ['freeform', 'Freeform', 'Reference layouts from the frame collection'], ['mixed-sizes', 'Mixed sizes', 'Reference layouts from the frame collection']]) {
  const section = document.createElement('section');
  section.id = style;
  section.innerHTML = `<div class="section-head"><h2>${heading}</h2><p>${note}</p></div><div class="axis"><span>People ↓<br>Photos →</span>${[1,2,3,4,5].map(n => `<span>${n} / person</span>`).join('')}</div>`;
  for (let people = 1; people <= 6; people++) {
    const row = document.createElement('div');
    row.className = 'row';
    const rowLabel = document.createElement('div');
    rowLabel.className = 'row-label';
    rowLabel.textContent = `${people} ${people === 1 ? 'person' : 'people'}`;
    row.appendChild(rowLabel);
    for (let perPerson = 1; perPerson <= 5; perPerson++) {
      const frame = data.layouts[style][`${people}x${perPerson}`];
      const button = document.createElement('button');
      button.className = 'option';
      button.type = 'button';
      const thumbnail = document.createElement('div');
      thumbnail.className = 'thumbnail-box';
      thumbnail.appendChild(buildFrame(frame, people, perPerson, false, 170, 168));
      button.appendChild(thumbnail);
      const title = document.createElement('strong');
      title.textContent = `${people} ${people === 1 ? 'person' : 'people'} × ${perPerson} ${perPerson === 1 ? 'photo' : 'photos'}`;
      button.appendChild(title);
      const count = document.createElement('small');
      count.textContent = `${frame.slots.length} total ${frame.slots.length === 1 ? 'frame' : 'frames'}`;
      button.appendChild(count);
      button.addEventListener('click', () => {
        document.getElementById('detail-title').textContent = `${heading}: ${people} ${people === 1 ? 'person' : 'people'} × ${perPerson} ${perPerson === 1 ? 'photo' : 'photos'}`;
        document.getElementById('detail-meta').textContent = `${frame.slots.length} total frames · ${style === 'photostrip' ? 'one column' : style === 'side-by-side' ? `${new Set(frame.slots.filter(s => s.y === frame.slots[0].y).map(s => s.x)).size} columns` : 'reference frame layout'}`;
        const body = document.getElementById('detail-body');
        body.replaceChildren(buildFrame(frame, people, perPerson, true, Math.min(620, window.innerWidth - 66), Math.max(740, frame.height / frame.width * 360)));
        dialog.showModal();
      });
      row.appendChild(button);
    }
    section.appendChild(row);
  }
  catalog.appendChild(section);
}
document.querySelector('.close').addEventListener('click', () => dialog.close());
</script>
</body>
